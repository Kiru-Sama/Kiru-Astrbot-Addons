<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>反馈面板</title>
<script src="/api/plugin/page/bridge-sdk.js"></script>
<style>
  :root{
    --bg:#0f1319; --card:#171d26; --line:#232b38; --txt:#e6ebf2; --dim:#8b97a8;
    --accent:#3b82f6; --new:#f59e0b; --done:#22c55e; --drop:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
         position:sticky;top:0;background:var(--bg);z-index:5}
  h1{font-size:15px;margin:0;font-weight:600}
  .chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .chip{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .chip b{color:var(--txt)}
  .toolbar{display:flex;gap:8px;padding:10px 16px;align-items:center;flex-wrap:wrap}
  button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--txt);
         padding:5px 10px;border-radius:8px;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  input[type=search]{flex:1;min-width:140px;padding:6px 10px;border-radius:8px;
         border:1px solid var(--line);background:var(--card);color:var(--txt)}
  main{padding:0 16px 24px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:10px 12px;margin-bottom:8px}
  .item.done{opacity:.62}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .id{font-family:ui-monospace,Consolas,monospace;color:var(--dim);font-size:12px}
  .cat{font-size:12px;padding:1px 7px;border-radius:6px;background:#1e2634;color:#9db2cd}
  .st{font-size:12px;padding:1px 7px;border-radius:6px}
  .st.new{background:rgba(245,158,11,.16);color:var(--new)}
  .st.done{background:rgba(34,197,94,.16);color:var(--done)}
  .st.dropped{background:rgba(100,116,139,.18);color:var(--drop)}
  .when{color:var(--dim);font-size:12px}
  .text{margin:6px 0 8px;white-space:pre-wrap;word-break:break-word}
  .acts{display:flex;gap:6px}
  .acts button{font-size:12px;padding:3px 8px}
  .empty{color:var(--dim);text-align:center;padding:40px 0}
  .err{color:#f87171;padding:20px 0;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h1>反馈通道</h1>
  <div class="chips" id="chips"></div>
</header>

<div class="toolbar">
  <button class="on" data-f="">全部</button>
  <button data-f="new">待处理</button>
  <button data-f="done">已处理</button>
  <button data-f="dropped">已忽略</button>
  <input type="search" id="q" placeholder="搜内容 / 分类 / 提交人" />
  <button id="refresh">刷新</button>
</div>

<main id="list"><div class="empty">加载中…</div></main>

<script>
const P = window.AstrBotPluginPage;
const STATUS = { new: "待处理", done: "已处理", dropped: "已忽略" };
let filter = "";
let timer = null;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]
  ));
}
function when(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function loadStats() {
  try {
    const s = await P.apiGet("/ncd-feedback/stats");
    const stat = (s && s.by_status) || {};
    document.getElementById("chips").innerHTML = [
      `<span class="chip">总数 <b>${s.total || 0}</b></span>`,
      `<span class="chip">待处理 <b>${stat.new || 0}</b></span>`,
      `<span class="chip">已处理 <b>${stat.done || 0}</b></span>`,
    ].join("");
  } catch (e) { /* 统计失败不影响列表 */ }
}

async function loadList() {
  const box = document.getElementById("list");
  try {
    const q = document.getElementById("q").value.trim();
    const r = await P.apiPost("/ncd-feedback/list", { status: filter, q, limit: 200 });
    const items = (r && r.items) || [];
    if (!items.length) {
      box.innerHTML = `<div class="empty">${filter ? "这个分类下没有记录" : "还没有人提反馈"}</div>`;
      return;
    }
    box.innerHTML = items.map(it => {
      const st = it.status || "new";
      return `<div class="item ${st}">
        <div class="row">
          <span class="id">#${esc(it.id)}</span>
          <span class="cat">${esc(it.category || "其他")}</span>
          <span class="st ${st}">${STATUS[st] || st}</span>
          <span class="when">${when(it.ts)}</span>
          ${it.sender ? `<span class="when">· ${esc(it.sender)}</span>` : ""}
          ${it.group ? `<span class="when">· ${esc(it.group)}</span>` : ""}
        </div>
        <div class="text">${esc(it.text)}</div>
        <div class="acts">
          ${st !== "done" ? `<button data-act="done" data-id="${esc(it.id)}">标记已处理</button>` : ""}
          ${st !== "dropped" ? `<button data-act="dropped" data-id="${esc(it.id)}">忽略</button>` : ""}
          ${st !== "new" ? `<button data-act="new" data-id="${esc(it.id)}">改回待处理</button>` : ""}
          <button data-act="del" data-id="${esc(it.id)}">删除</button>
        </div>
      </div>`;
    }).join("");
  } catch (e) {
    box.innerHTML = `<div class="err">读取失败：${esc(e && e.message || e)}</div>`;
  }
}

document.querySelectorAll(".toolbar button[data-f]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".toolbar button[data-f]").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    filter = btn.dataset.f || "";
    loadList();
  });
});

document.getElementById("q").addEventListener("input", () => {
  clearTimeout(window.__q);
  window.__q = setTimeout(loadList, 300);
});

document.getElementById("refresh").addEventListener("click", () => { loadList(); loadStats(); });

document.getElementById("list").addEventListener("click", async ev => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  const id = btn.dataset.id, act = btn.dataset.act;
  btn.disabled = true;
  try {
    if (act === "del") {
      await P.apiPost("/ncd-feedback/delete", { id });
    } else {
      await P.apiPost("/ncd-feedback/resolve", { id, status: act });
    }
    await loadList(); loadStats();
  } catch (e) {
    alert("操作失败：" + (e && e.message || e));
    btn.disabled = false;
  }
});

function start() {
  loadStats(); loadList();
  clearInterval(timer);
  timer = setInterval(() => {
    if (document.visibilityState === "visible") { loadStats(); loadList(); }
  }, 10000);
}
start();
</script>
</body>
</html>
